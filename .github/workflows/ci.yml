name: homeAI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  deterministic-gates:
    name: deterministic gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Full tests
        run: corepack pnpm test

      - name: Scope tests
        run: corepack pnpm vitest tests/scope

      - name: Red-zone diff check
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          red_zone=$(git diff --name-only "$BASE_REF"...HEAD -- \
            "apps/web/app/p1/**" \
            "packages/floorplan-parser/**" \
            "packages/geometry/**" \
            "packages/scene/**" \
            "packages/contracts/src/p1-*" \
            "packages/contracts/src/scene*" \
            "packages/contracts/src/design-kernel*" \
            "packages/contracts/src/layout-intent*" \
            "packages/contracts/src/anchor*" \
            "packages/contracts/src/floorplan*" || true)
          if [ -n "$red_zone" ]; then
            printf '%s\n' "$red_zone"
            echo "Space Truth red-zone diff requires explicit GPT Pro approval; CI fails closed."
            exit 1
          fi

      - name: Network/provider scan
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}"...HEAD | grep -Ev '(^docs/|^\.hermes/|^\.github/|\.md$|\.mdx$|\.txt$|\.ps1$|\.sh$|\.ya?ml$|\.json$|\.lock$)' || true)
          if [ -z "$files" ]; then exit 0; fi
          if git grep -nE "(fetch\(|axios|undici|node-fetch|XMLHttpRequest|node:http|node:https)" -- $files; then
            echo "Unauthorized network/provider call pattern found in changed runtime files."
            exit 1
          fi

      - name: Secrets scan
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}"...HEAD | grep -Ev '(^docs/|^\.hermes/|^\.github/|\.md$|\.mdx$|\.txt$|\.ps1$|\.sh$|\.ya?ml$|\.json$|\.lock$)' || true)
          if [ -z "$files" ]; then exit 0; fi
          if git grep -nE "(OPENAI_API_KEY|ANTHROPIC_API_KEY|GOOGLE_API_KEY|DASHSCOPE_API_KEY|SECRET|TOKEN|PASSWORD)" -- $files; then
            echo "Secret/token/password pattern found in changed runtime files."
            exit 1
          fi

      - name: Real provider disabled scan
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}"...HEAD | grep -Ev '(^docs/|^\.hermes/|^\.github/|\.md$|\.mdx$|\.txt$|\.ps1$|\.sh$|\.ya?ml$|\.json$|\.lock$)' || true)
          if [ -z "$files" ]; then exit 0; fi
          if git grep -nE "(realProviderEnabled\s*:\s*true|networkCallsEnabled\s*:\s*true|requiresRealPaymentProvider\s*:\s*true)" -- $files; then
            echo "Real provider/network/payment provider appears enabled."
            exit 1
          fi

      - name: Duplicate canonical schema scan
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -nE "(CanonicalFloorplanRevision|SceneContract|geometryHash)" -- . ':!packages/contracts/src/**' ':!tests/**' ':!docs/**' ':!AGENTS.md' ':!CLAUDE.md' ':!CODEX.md' ':!.hermes/**' || true)
          if printf '%s\n' "$matches" | grep -E "z\.object|interface |type .*="; then
            echo "Potential duplicate canonical schema outside contracts detected."
            exit 1
          fi

      - name: CRLF / hidden unicode scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(['git','diff','--name-only', 'origin/${{ github.base_ref || 'main' }}...HEAD'], text=True).splitlines()
          bad=[]
          for f in files:
              p=pathlib.Path(f)
              if not p.exists() or p.is_dir():
                  continue
              b=p.read_bytes()
              if b'\r\n' in b:
                  bad.append(f'{f}: CRLF')
              txt=b.decode('utf-8', errors='ignore')
              if any('\u202a' <= c <= '\u202e' or '\u2066' <= c <= '\u2069' for c in txt):
                  bad.append(f'{f}: bidi unicode')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          PY
